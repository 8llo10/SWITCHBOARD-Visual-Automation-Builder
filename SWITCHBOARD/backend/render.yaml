services:
  - type: web
    name: switchboard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@switchboard.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
