name: Live authentication diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/auth-smoke.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Backend liveness (no credentials)
        shell: bash
        run: |
          set +e
          echo "== /health =="
          curl -sSL --max-time 65 --retry 1 --retry-delay 4 -o /tmp/sb-health -w 'HTTP status: %{http_code}; total time: %{time_total}s\n' 'https://switchboard-api-tqc3.onrender.com/health'
          sed -E 's/"[^"]*(password|token|secret)[^"]*":("[^"]*"|[^,}]+)/"[redacted]":"[redacted]"/Ig' /tmp/sb-health | head -c 1000 || true
          echo
          echo "== /api/auth/config =="
          curl -sSL --max-time 65 --retry 1 --retry-delay 4 -o /tmp/sb-config -w 'HTTP status: %{http_code}; total time: %{time_total}s\n' 'https://switchboard-api-tqc3.onrender.com/api/auth/config'
          head -c 1000 /tmp/sb-config || true
          echo
