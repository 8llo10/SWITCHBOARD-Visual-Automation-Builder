name: Live authentication diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-smoke.yml'
      - 'SWITCHBOARD/backend/**'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Backend liveness and email readiness (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          base="https://switchboard-api-tqc3.onrender.com"
          check() {
            local path="$1"
            local status
            status=$(curl -sSL --connect-timeout 12 --max-time 40 -o /dev/null -w '%{http_code}' "$base$path") || status=000
            echo "$path -> HTTP $status"
            if [[ "$status" != "200" ]]; then
              echo "::error::Render backend did not return HTTP 200 for $path. Inspect Render deploy logs and environment."
              exit 1
            fi
          }
          check "/health"
          check "/health/ready"
          check "/api/auth/config"
