name: Backend authentication checks
on:
  push:
    branches: [main]
    paths:
      - 'SWITCHBOARD/backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SWITCHBOARD/backend
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SWITCHBOARD/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Compile API
        run: npm run build
      - name: Run isolated unit tests
        run: npm test
      - name: Build production Docker image
        run: docker build --pull -t switchboard-backend:ci .

      - name: Smoke test container liveness without a database
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 32)"
          docker run -d --name sb-smoke -p 127.0.0.1:14000:4000 \
            -e PORT=4000 \
            -e DATABASE_URL=postgresql://ci@127.0.0.1:5432/ci \
            -e CREDENTIAL_ENCRYPTION_KEY="$key" \
            switchboard-backend:ci
          trap 'docker logs --tail=45 sb-smoke || true; docker rm -f sb-smoke >/dev/null 2>&1 || true' EXIT
          for n in {1..20}; do
            if curl -fsS --max-time 2 http://127.0.0.1:14000/health > /tmp/sb-health.json; then break; fi
            sleep 1
          done
          cat /tmp/sb-health.json
          test "$(curl -s --max-time 4 -o /tmp/sb-ready.json -w '%{http_code}' http://127.0.0.1:14000/health/ready)" = '503'
          test "$(curl -s --max-time 4 -o /tmp/sb-api.json -w '%{http_code}' http://127.0.0.1:14000/api/workflows)" = '503'
          grep -q 'SERVICE_NOT_READY' /tmp/sb-api.json
